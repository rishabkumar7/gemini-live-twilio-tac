[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tac-gemini-live-demo"
version = "0.1.0"
description = "Twilio Agent Connect voice demo backed by the Gemini Live API"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "audioop-lts>=0.2.2; python_version >= '3.13'",
    "google-genai>=2.31.0,<3",
    "python-dotenv>=1.1.1,<2",
    "twilio-agent-connect[server]>=2.4.0,<2.5",
]

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.2,<2",
    "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tac_gemini_live"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["tac_gemini_live"]

[[tool.mypy.overrides]]
module = ["audioop", "tac.*", "twilio.*"]
ignore_missing_imports = true

